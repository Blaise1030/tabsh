name: CI

# Every push and pull request checks the daemon and web source. The site build
# and Cloudflare deploy run only from the release workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon:
    name: Daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The daemon drives PTYs, so test on both platforms it supports.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  site:
    name: Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: node --test ../.github/scripts/select-e2e.test.mjs

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          # The selector compares the checked-out commit with the PR base or
          # previous main commit. Both must be available locally.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The spec drives the real daemon, so build it first — at the repo root,
      # not the job's web/ default.
      - name: Build the daemon
        working-directory: .
        run: cargo build --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Select E2E specs
        id: select
        run: node ../.github/scripts/select-e2e.mjs
        env:
          E2E_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          E2E_HEAD: ${{ github.sha }}
      - run: |
          read -r -a e2e_specs <<< "$E2E_SPECS"
          npm run test:e2e -- "${e2e_specs[@]}"
        env:
          TABSH_BIN: ../target/debug/tabsh
          E2E_SPECS: ${{ steps.select.outputs.specs }}
