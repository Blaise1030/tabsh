name: Bug report
description: Something in tabsh is broken or behaves unexpectedly.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The more of this you fill in, the faster it
        can be fixed. If this is a security issue, do not open a public bug;
        see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I clicked a card, the drawer opened, and the chat never loaded.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `tabsh`
        2. Open the board (⌘B)
        3. Click a UI card
        4. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tabsh version
      description: Output of `tabsh --version`, or the release you installed.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS and architecture
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (x86-64)
        - Linux (arm64)
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - curl install script
        - Homebrew
        - cargo install
        - Built from source
        - Other
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Safari
        - Firefox
        - Edge
        - Arc
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        Paste the daemon output, the browser console errors, or a screenshot.
        Remove any tokens or private paths first.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed tokens and private paths from the logs.
          required: true
